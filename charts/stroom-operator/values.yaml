# Default values for stroom-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Specify a private registry to pull the operator image from, in place of the registry in image.repository. For
# example, `registry.example.com` pulls `registry.example.com/gradata-systems/stroom-k8s-operator`.
registry: ""

image:
  repository: ghcr.io/gradata-systems/stroom-k8s-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
