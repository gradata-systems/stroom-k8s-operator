name: Build Helm Chart

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  HELM_VERSION: v3.22.1

jobs:
  build_helm_chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Check the CRDs chart is up to date
        run: |
          make manifests kustomize
          bin/kustomize build config/crd --output charts/stroom-operator-crds/templates/
          git diff --exit-code charts/stroom-operator-crds/templates \
            || { echo "::error::Regenerate the stroom-operator-crds chart templates from config/crd"; exit 1; }
      - name: Lint charts
        run: helm lint charts/stroom-operator-crds charts/stroom-operator
      - name: Build stroom-operator-crds chart
        run: helm package ./charts/stroom-operator-crds
      - name: Build stroom-operator chart
        run: helm package ./charts/stroom-operator
