name: Release

# Publishes the operator image and Helm charts when a GitHub release is published. The release tag must match the
# operator version in the Makefile, e.g. `1.2.0`.

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/gradata-systems/stroom-k8s-operator
  CHART_REGISTRY: oci://ghcr.io/gradata-systems/helm-charts
  HELM_VERSION: v3.22.1

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check versions match the release tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(grep -Po '^VERSION \?= \K(.+)' Makefile)
          app_version=$(grep -Po '^appVersion: "\K[^"]+' charts/stroom-operator/Chart.yaml)
          operator_chart=$(grep -Po '^version: \K(.+)' charts/stroom-operator/Chart.yaml)
          crds_chart=$(grep -Po '^version: \K(.+)' charts/stroom-operator-crds/Chart.yaml)
          echo "Tag: $TAG, Makefile: $version, chart appVersion: $app_version, charts: $operator_chart, $crds_chart"
          [ "$TAG" = "$version" ] || { echo "::error::Release tag $TAG doesn't match the Makefile VERSION $version"; exit 1; }
          [ "$app_version" = "$version" ] || { echo "::error::Chart appVersion $app_version doesn't match $version"; exit 1; }
          [ "$operator_chart" = "$crds_chart" ] || { echo "::error::Chart versions differ: $operator_chart, $crds_chart"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check generated release files are up to date
        run: |
          make manifests kustomize
          bin/kustomize build config/crd --output charts/stroom-operator-crds/templates/
          git diff --exit-code charts/stroom-operator-crds/templates config/crd \
            || { echo "::error::Regenerate the CRDs and the stroom-operator-crds chart before releasing"; exit 1; }
      - name: Test
        run: make test

  image:
    name: Publish image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.verify.outputs.version }}
          # Links the image's GHCR package to this repository
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}

  charts:
    name: Publish charts and manifests
    needs: [verify, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Package charts
        run: |
          mkdir -p dist
          helm lint charts/stroom-operator-crds charts/stroom-operator
          helm package charts/stroom-operator-crds --destination dist
          helm package charts/stroom-operator --destination dist
      - name: Push charts
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          for chart in dist/*.tgz; do
            helm push "$chart" "$CHART_REGISTRY"
          done
      - name: Build install manifests
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          make kustomize
          (cd config/manager && ../../bin/kustomize edit set image "controller=$IMAGE:$VERSION")
          bin/kustomize build config/default > dist/all-in-one.yaml
          sed -rn 's/^\s*image: (.+:.+)\s*$/\1/p' dist/all-in-one.yaml > dist/images.txt
      - name: Attach files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
