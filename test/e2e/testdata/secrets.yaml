# OpenID client secrets. The values are fixed test values, also used by the Keycloak realm.
apiVersion: v1
kind: Secret
metadata:
  name: stroom-openid
stringData:
  client-secret: ${STROOM_CLIENT_SECRET}
---
apiVersion: v1
kind: Secret
metadata:
  name: stroom-operator-openid
stringData:
  client-secret: ${OPERATOR_CLIENT_SECRET}
