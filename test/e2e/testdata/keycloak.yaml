# Keycloak, as the external identity provider for Stroom. The realm defines two confidential clients with service
# accounts: `stroom`, used by Stroom itself, and `stroom-operator`, used by the operator's node lifecycle scripts.
# Service account user IDs are fixed, so the Stroom user for each can be created in advance.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
  stroom-realm.json: |
    {
      "realm": "stroom",
      "enabled": true,
      "clients": [
        {
          "clientId": "stroom",
          "enabled": true,
          "publicClient": false,
          "secret": "${STROOM_CLIENT_SECRET}",
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "redirectUris": ["*"],
          "webOrigins": ["*"],
          "protocolMappers": [{
            "name": "stroom-audience",
            "protocol": "openid-connect",
            "protocolMapper": "oidc-audience-mapper",
            "config": {"included.client.audience": "stroom", "access.token.claim": "true", "id.token.claim": "false"}
          }]
        },
        {
          "clientId": "stroom-operator",
          "enabled": true,
          "publicClient": false,
          "secret": "${OPERATOR_CLIENT_SECRET}",
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "protocolMappers": [{
            "name": "stroom-audience",
            "protocol": "openid-connect",
            "protocolMapper": "oidc-audience-mapper",
            "config": {"included.client.audience": "stroom", "access.token.claim": "true", "id.token.claim": "false"}
          }]
        }
      ],
      "users": [
        {"id": "${STROOM_SERVICE_ACCOUNT_ID}", "username": "service-account-stroom", "enabled": true, "serviceAccountClientId": "stroom"},
        {"id": "${OPERATOR_SERVICE_ACCOUNT_ID}", "username": "service-account-stroom-operator", "enabled": true, "serviceAccountClientId": "stroom-operator"}
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: ${KEYCLOAK_IMAGE}
          imagePullPolicy: IfNotPresent
          args:
            - start-dev
            - --import-realm
            - --http-port=8080
            - --health-enabled=true
            - --hostname=http://keycloak.${NAMESPACE}.svc.cluster.local:8080
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
            - name: JAVA_OPTS_KC_HEAP
              value: -XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=70
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
