# TLS certificate and key store password for a StroomCluster using HTTPS. The certificate is generated by the tests.
apiVersion: v1
kind: Secret
metadata:
  name: stroom-tls
type: kubernetes.io/tls
data:
  tls.crt: ${TLS_CRT}
  tls.key: ${TLS_KEY}
  ca.crt: ${CA_CRT}
---
apiVersion: v1
kind: Secret
metadata:
  name: stroom-keystore
stringData:
  password: e2e-keystore-password
