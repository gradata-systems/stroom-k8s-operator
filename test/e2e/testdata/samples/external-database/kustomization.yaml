# The external-database sample, sized for a kind cluster, in its own namespace. The tests also replace the sample's
# placeholder database and Keycloak addresses, and secrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stroom-e2e-samples-external
resources:
  - ../../../../../samples/external-database
patches:
  - target:
      kind: StroomCluster
    patch: |
      - op: replace
        path: /spec/ingress/hostName
        value: stroom.e2e.local
      - op: replace
        path: /spec/nodeSets/0/count
        value: 1
      - op: replace
        path: /spec/nodeSets/0/localDataVolumeClaim/resources/requests/storage
        value: 2Gi
      - op: replace
        path: /spec/nodeSets/0/resources
        value: {requests: {cpu: 250m, memory: 1Gi}, limits: {memory: 2Gi}}
      - op: replace
        path: /spec/nodeSets/0/memoryOptions
        value: {initialPercentage: 25, maxPercentage: 70}
