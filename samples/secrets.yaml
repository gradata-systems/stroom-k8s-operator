# Secrets the dev StroomCluster uses. Replace the values, or create the Secrets another way, for example with a
# secret manager. The TLS certificates aren't included: create stroom-tls, a kubernetes.io/tls Secret with tls.crt,
# tls.key and ca.crt, for example with cert-manager.
apiVersion: v1
kind: Secret
metadata:
  name: stroom-openid
  namespace: stroom
stringData:
  # The secret of Stroom's own OpenID client, `stroom`
  client-secret: replace-with-the-stroom-client-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: stroom-operator-openid
  namespace: stroom
stringData:
  # The secret of the OpenID client the operator's node lifecycle scripts use, `stroom-operator`. Its service
  # account needs a Stroom user with the Manage Nodes, Manage Jobs and Manage Tasks permissions.
  client-secret: replace-with-the-operator-client-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: stroom-keystore
  namespace: stroom
stringData:
  # Password for the key store and trust store each node creates from stroom-tls
  password: replace-with-a-key-store-password
