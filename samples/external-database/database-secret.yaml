# The password of the Stroom database user, keyed by the user name. Replace the value.
#
# The databases and the user must exist before the StroomCluster is created. For example, as a MySQL administrator:
#
#   CREATE DATABASE stroom;
#   CREATE DATABASE stats;
#   CREATE USER 'stroomuser'@'%' IDENTIFIED BY 'the-stroomuser-password';
#   GRANT ALL PRIVILEGES ON stroom.* TO 'stroomuser'@'%';
#   GRANT ALL PRIVILEGES ON stats.* TO 'stroomuser'@'%';
apiVersion: v1
kind: Secret
metadata:
  name: stroom-db
stringData:
  stroomuser: replace-with-the-stroomuser-password
