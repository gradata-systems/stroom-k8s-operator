# The key store password. Replace the value, or create the Secret another way, for example with a secret manager.
# The TLS certificate isn't included: create stroom-tls, a kubernetes.io/tls Secret with tls.crt, tls.key and
# ca.crt, for example with cert-manager.
apiVersion: v1
kind: Secret
metadata:
  name: stroom-keystore
stringData:
  # Password for the key store and trust store each node creates from stroom-tls
  password: replace-with-a-key-store-password
