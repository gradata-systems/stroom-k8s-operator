# A copy of samples/autoscaler.yaml, for the operator bundle. Keep the two in step.
# Keeps the processing nodes' CPU use between 50% and 90% of their limit, by adjusting their Data Processor task limit
apiVersion: stroom.gchq.github.io/v1
kind: StroomTaskAutoscaler
metadata:
  name: dev
spec:
  stroomClusterRef:
    name: dev
  taskName: Data Processor
  adjustmentIntervalMins: 1
  metricsSlidingWindowMins: 1
  minCpuPercent: 50
  maxCpuPercent: 90
  minTaskLimit: 1
  maxTaskLimit: 20
  stepAmount: 1
