data:
  crontab.txt: |-
    * * * * * ${LOG_SENDER_SCRIPT} "${STROOM_BASE_LOGS_DIR}/access" STROOM-ACCESS-EVENTS "${STROOM_DATAFEED_URL}" --system "${STROOM_SYSTEM_NAME}" --environment "${STROOM_ENVIRONMENT_NAME}" --file-regex "${STROOM_FILE_REGEX}" -m ${STROOM_MAX_DELAY_SECS} --delete-after-sending --no-secure --compress > /dev/stdout
    * * * * * ${LOG_SENDER_SCRIPT} "${STROOM_BASE_LOGS_DIR}/app"    STROOM-APP-EVENTS    "${STROOM_DATAFEED_URL}" --system "${STROOM_SYSTEM_NAME}" --environment "${STROOM_ENVIRONMENT_NAME}" --file-regex "${STROOM_FILE_REGEX}" -m ${STROOM_MAX_DELAY_SECS} --delete-after-sending --no-secure --compress > /dev/stdout
    * * * * * ${LOG_SENDER_SCRIPT} "${STROOM_BASE_LOGS_DIR}/user"   STROOM-USER-EVENTS   "${STROOM_DATAFEED_URL}" --system "${STROOM_SYSTEM_NAME}" --environment "${STROOM_ENVIRONMENT_NAME}" --file-regex "${STROOM_FILE_REGEX}" -m ${STROOM_MAX_DELAY_SECS} --delete-after-sending --no-secure --compress > /dev/stdout
metadata:
  labels:
    app.kubernetes.io/component: stroom-cluster
    app.kubernetes.io/name: stroom
    stroom/cluster: full
  name: stroom-full-log-sender
  namespace: golden-full
  ownerReferences:
  - apiVersion: stroom.gchq.github.io/v1
    blockOwnerDeletion: true
    controller: true
    kind: StroomCluster
    name: full
    uid: <uid>
