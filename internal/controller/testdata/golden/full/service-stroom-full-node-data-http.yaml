metadata:
  labels:
    app.kubernetes.io/component: stroom-cluster
    app.kubernetes.io/name: stroom
    stroom/cluster: full
  name: stroom-full-node-data-http
  namespace: golden-full
  ownerReferences:
  - apiVersion: stroom.gchq.github.io/v1
    blockOwnerDeletion: true
    controller: true
    kind: StroomCluster
    name: full
    uid: <uid>
spec:
  ports:
  - name: app-https
    port: 8443
    protocol: TCP
    targetPort: 0
  - name: app-http
    port: 8080
    protocol: TCP
    targetPort: 0
  - name: admin
    port: 8081
    protocol: TCP
    targetPort: 0
  selector:
    stroom/cluster: full
    stroom/nodeSet: data
  type: ClusterIP
status:
  loadBalancer: {}
