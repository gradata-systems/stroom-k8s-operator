metadata:
  labels:
    app.kubernetes.io/component: database-server
    app.kubernetes.io/instance: full
    app.kubernetes.io/name: stroom
  name: stroom-full-db
  namespace: golden-full
  ownerReferences:
  - apiVersion: stroom.gchq.github.io/v1
    blockOwnerDeletion: true
    controller: true
    kind: DatabaseServer
    name: full
    uid: <uid>
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: database-server
      app.kubernetes.io/instance: full
      app.kubernetes.io/name: stroom
  serviceName: stroom-full-db-headless
  template:
    metadata:
      labels:
        app.kubernetes.io/component: database-server
        app.kubernetes.io/instance: full
        app.kubernetes.io/name: stroom
    spec:
      affinity: {}
      automountServiceAccountToken: false
      containers:
      - env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: root
              name: stroom-full-db
        - name: MYSQL_USER
          value: stroomuser
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              key: stroomuser
              name: stroom-full-db
        image: mysql/mysql-server:8.0.32
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - -u
            - healthcheck
            - ping
          failureThreshold: 10
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        name: mysql
        ports:
        - containerPort: 3306
          name: mysql
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - mysql
            - -u
            - healthcheck
            - -e
            - SELECT 1
          failureThreshold: 10
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - mountPath: /etc/my.cnf
          name: config
          readOnly: true
          subPath: my.cnf
        - mountPath: /docker-entrypoint-initdb.d
          name: config-init
          readOnly: true
        - mountPath: /var/lib/mysql
          name: data
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: stroom-full-db
        name: config
      - configMap:
          name: stroom-full-db-init
        name: config-init
  updateStrategy: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
    status: {}
status:
  availableReplicas: 0
  replicas: 0
