metadata:
  labels:
    app.kubernetes.io/component: database-server
    app.kubernetes.io/instance: minimal
    app.kubernetes.io/name: stroom
  name: stroom-minimal-db
  namespace: golden-minimal
  ownerReferences:
  - apiVersion: stroom.gchq.github.io/v1
    blockOwnerDeletion: true
    controller: true
    kind: DatabaseServer
    name: minimal
    uid: <uid>
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: database-server
      app.kubernetes.io/instance: minimal
      app.kubernetes.io/name: stroom
  serviceName: stroom-minimal-db-headless
  template:
    metadata:
      labels:
        app.kubernetes.io/component: database-server
        app.kubernetes.io/instance: minimal
        app.kubernetes.io/name: stroom
    spec:
      affinity: {}
      automountServiceAccountToken: false
      containers:
      - env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: root
              name: stroom-minimal-db
        - name: MYSQL_USER
          value: stroomuser
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              key: stroomuser
              name: stroom-minimal-db
        image: mysql/mysql-server:latest
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - -u
            - healthcheck
            - ping
        name: mysql
        ports:
        - containerPort: 3306
          name: mysql
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - mysql
            - -u
            - healthcheck
            - -e
            - SELECT 1
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - mountPath: /etc/my.cnf
          name: config
          readOnly: true
          subPath: my.cnf
        - mountPath: /docker-entrypoint-initdb.d
          name: config-init
          readOnly: true
        - mountPath: /var/lib/mysql
          name: data
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: stroom-minimal-db
        name: config
      - configMap:
          name: stroom-minimal-db-init
        name: config-init
  updateStrategy: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      resources: {}
    status: {}
status:
  availableReplicas: 0
  replicas: 0
